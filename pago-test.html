<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de pago · Flamma</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  body{background:#f3eee4}
  .paybox{max-width:560px;margin:32px auto;padding:0 20px}
  #log p{font-family:monospace;font-size:13px;margin:4px 0;padding:6px 8px;background:#fff;border-radius:6px;word-break:break-word}
  #sumup-card{margin-top:16px}
</style>
</head>
<body>
<div class="paybox">
  <h1 class="display" style="font-size:1.6rem">Prueba de pago — diagnóstico</h1>
  <div id="log"></div>
  <div id="sumup-card"></div>
</div>

<script src="https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js"
        onerror="window.__sdkfail=true"></script>
<script>
  const log = (m) => { document.getElementById("log").innerHTML += "<p>" + m + "</p>"; };
  (async () => {
    log("1) SDK de SumUp cargado: " + (typeof SumUpCard !== "undefined" ? "SÍ" : "NO") + (window.__sdkfail ? " (falló la descarga)" : ""));
    let r, txt;
    try {
      r = await fetch("/.netlify/functions/create-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: 1.00, description: "Prueba Flamma 1€" })
      });
      log("2) La función respondió con código HTTP: " + r.status);
      txt = await r.text();
      log("3) Respuesta de la función: " + (txt ? txt.slice(0, 600) : "(vacía)"));
    } catch (e) {
      log("❌ No se pudo llamar a la función: " + e);
      return;
    }
    let data;
    try { data = JSON.parse(txt); } catch (e) { log("❌ La función no devolvió JSON válido (probablemente no está desplegada)."); return; }
    if (!r.ok || !data.id) { log("❌ No se obtuvo checkout. Mira el punto 3 para ver por qué."); return; }
    log("✅ 4) Checkout creado: " + data.id + " — montando el formulario de tarjeta…");
    try {
      SumUpCard.mount({ id: data.id, onResponse: (type, body) => log("Pago → " + type + ": " + JSON.stringify(body)) });
    } catch (e) { log("❌ Error al montar el formulario: " + e); }
  })();
</script>
</body>
</html>
