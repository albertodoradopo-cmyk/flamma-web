<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de pago · Flamma</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  body{background:#f3eee4}
  .paybox{max-width:560px;margin:32px auto;padding:0 20px}
  #log p{font-family:monospace;font-size:13px;margin:4px 0;padding:6px 8px;background:#fff;border-radius:6px;word-break:break-word}
  #sumup-card{margin-top:16px;min-height:60px;border:2px dashed #c9bfa8;border-radius:8px;padding:8px}
</style>
</head>
<body>
<div class="paybox">
  <h1 class="display" style="font-size:1.6rem">Prueba de pago — diagnóstico 2</h1>
  <div id="log"></div>
  <p style="font-family:monospace;font-size:12px;color:#888">↓ el formulario debería aparecer dentro del recuadro punteado ↓</p>
  <div id="sumup-card"></div>
</div>

<script src="https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js"></script>
<script>
  const log = (m) => { document.getElementById("log").innerHTML += "<p>" + m + "</p>"; };
  const card = () => document.getElementById("sumup-card");
  (async () => {
    log("1) SDK SumUp: " + (typeof SumUpCard !== "undefined" ? "SÍ" : "NO"));
    let r, txt, data;
    try {
      r = await fetch("/.netlify/functions/create-checkout", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ amount: 1.00 }) });
      txt = await r.text(); data = JSON.parse(txt);
    } catch(e){ log("❌ función: " + e); return; }
    if(!data || !data.id){ log("❌ sin id: " + txt); return; }
    log("2) Checkout: " + data.id);
    try {
      SumUpCard.mount({ checkoutId: data.id, onResponse: (type, body) => log("PAGO → " + type + ": " + JSON.stringify(body)) });
      log("3) mount() ejecutado sin error");
    } catch(e){ log("❌ mount lanzó error: " + e); return; }
    function inspeccion(t){
      const c = card();
      const iframes = c.getElementsByTagName("iframe").length;
      const hijos = c.childElementCount;
      const html = (c.innerHTML || "").length;
      log(`4) A los ${t}: hijos=${hijos}, iframes=${iframes}, tamaño HTML=${html}`);
    }
    setTimeout(()=>inspeccion("1.5s"), 1500);
    setTimeout(()=>inspeccion("4s"), 4000);
  })();
</script>
</body>
</html>
